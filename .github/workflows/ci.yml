name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install varyk
        run: cargo install varyk --version '^0.7' --locked

      - name: Check
        run: varyk check

      - name: Test
        run: varyk test

      # The users API of the README, on varyk-sql and SQLite.
      - name: Demo
        working-directory: demo/users
        run: varyk test

      - name: Format check
        run: rustfmt --edition 2024 --check src/*.rs

      - name: Clippy
        run: |
          crate="$(varyk publish --assemble-only)"
          cd "$crate"
          cargo clippy --all-targets -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    env:
      # Pins every cargo call to 1.85.
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.85

      - name: Install varyk
        run: cargo install varyk --version '^0.7' --locked

      - name: Check
        run: varyk check

      - name: Test
        run: varyk test
